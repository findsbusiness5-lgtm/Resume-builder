<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume Builder - ResumeCraft</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f5f9;
  color:#171923;
}

/* HEADER */
.header{
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  color:#5b4df6;
  font-size:22px;
  font-weight:800;
  text-decoration:none;
}

.header button{
  border:0;
  background:#5b4df6;
  color:white;
  padding:10px 16px;
  border-radius:9px;
  font-weight:bold;
}

/* LAYOUT */
.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
  display:grid;
  grid-template-columns:420px 1fr;
  gap:25px;
}

/* FORM */
.form-box{
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.form-box h1{
  font-size:26px;
  margin-bottom:5px;
}

.subtitle{
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

.section-title{
  font-size:17px;
  font-weight:800;
  margin:24px 0 12px;
  padding-bottom:8px;
  border-bottom:1px solid #eee;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:12px 0 6px;
}

input,
textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:8px;
  padding:11px;
  font-size:14px;
  outline:none;
  font-family:inherit;
}

input:focus,
textarea:focus{
  border-color:#5b4df6;
}

textarea{
  min-height:85px;
  resize:vertical;
}

.button{
  width:100%;
  border:0;
  padding:13px;
  border-radius:9px;
  background:#5b4df6;
  color:#fff;
  font-weight:800;
  margin-top:20px;
}

/* PREVIEW */
.preview-area{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.resume{
  width:794px;
  min-height:1123px;
  background:#fff;
  box-shadow:0 8px 35px rgba(0,0,0,.12);
  padding:55px;
}

.resume-header{
  border-bottom:3px solid #5b4df6;
  padding-bottom:18px;
  margin-bottom:25px;
}

.resume-name{
  font-size:34px;
  font-weight:800;
}

.resume-job{
  color:#5b4df6;
  font-size:17px;
  font-weight:bold;
  margin-top:5px;
}

.contact{
  color:#666;
  font-size:12px;
  margin-top:10px;
  line-height:1.8;
}

.resume-section{
  margin-bottom:23px;
}

.resume-section h2{
  font-size:15px;
  color:#5b4df6;
  text-transform:uppercase;
  letter-spacing:1px;
  border-bottom:1px solid #ddd;
  padding-bottom:6px;
  margin-bottom:10px;
}

.resume-section p{
  font-size:12px;
  color:#444;
  line-height:1.7;
}

.skills{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.skill{
  background:#eeeaff;
  color:#4d40d2;
  padding:5px 9px;
  border-radius:5px;
  font-size:11px;
  font-weight:bold;
}

.placeholder{
  color:#aaa;
}

/* MOBILE */
@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }

  .preview-area{
    overflow:auto;
    justify-content:flex-start;
  }

  .resume{
    min-width:794px;
  }
}

/* PRINT */
@media print{

  body{
    background:white;
  }

  .header,
  .form-box{
    display:none;
  }

  .container{
    display:block;
    padding:0;
  }

  .preview-area{
    display:block;
  }

  .resume{
    box-shadow:none;
    width:100%;
    min-height:auto;
    padding:40px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <a href="index.html" class="logo">ResumeCraft</a>

  <button onclick="window.print()">
    Download PDF
  </button>
</header>


<div class="container">

<!-- ================= FORM ================= -->

<div class="form-box">

<h1>Create Your Resume</h1>

<p class="subtitle">
Fill in your information and see your resume update instantly.
</p>


<!-- PERSONAL -->
<div class="section-title">
Personal Information
</div>

<label>Full Name</label>
<input
  id="name"
  type="text"
  placeholder="John Smith"
  oninput="updateResume()"
>

<label>Professional Title</label>
<input
  id="job"
  type="text"
  placeholder="Marketing Manager"
  oninput="updateResume()"
>

<label>Email</label>
<input
  id="email"
  type="email"
  placeholder="john@example.com"
  oninput="updateResume()"
>

<label>Phone</label>
<input
  id="phone"
  type="text"
  placeholder
