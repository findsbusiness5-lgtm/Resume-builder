      margin: 0;

    }

    body {

      color: #171923;
      line-height: 1.6;

    /* NAVBAR */
    .navbar {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e8e8ee;
      padding: 16px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      color: #5b4df6;
    }

    .nav-btn {
      text-decoration: none;
      background: #5b4df6;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    /* HERO */
    .hero {
      min-height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
      background:

        radial-gradient(circle at bottom right, #e3f7ff 0, transparent 35%),
        #f7f8fc;
    }

    .hero-content {
      max-width: 850px;
    }

    .badge {
      display: inline-block;
      background: #ebe9ff;
      color: #5143dc;
      padding: 8px 15px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 24px;
    }

    .hero h1 span {
      color: #5b4df6;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      font-size: 19px;
      color: #606574;
      margin-bottom: 35px;
    }

    .main-btn {
      display: inline-block;
      background: #5b4df6;
      color: white;
      text-decoration: none;
      padding: 16px 30px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(91,77,246,0.25);
      transition: 0.2s;
    }

    .main-btn:hover {
      transform: translateY(-2px);
    }

    .small-text {
      margin-top: 15px;
      color: #858999;
      font-size: 13px;
    }

    /* FEATURES */
    .section {
      padding: 80px 6%;
      max-width: 1200px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #707584;
    }

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }
